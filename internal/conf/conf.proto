syntax = "proto3";
package kratos.api;

option go_package = "logisticsServer/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logger logger = 3;
  Trace trace = 4;
  Sf sf = 5;
  Auth auth = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  // 已移除数据库节点（原 Database database = 1，ent/MySQL 相关配置）。
  reserved 1;
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // 认证密码，为空表示无需认证。
    string password = 5;
    // 逻辑库编号，0 表示默认库。
    int32 db = 6;
    // 建立连接的超时时间。
    google.protobuf.Duration dial_timeout = 7;
  }
  Redis redis = 2;
}

// Logger 日志输出配置。
message Logger {
  // 最低输出级别：info/warn/error。请求日志与 Redis 命令日志均为 info 级别。
  string level = 1;
  // 日志目录，为空时只输出到标准输出。
  string path = 2;
  // 日志文件保留天数，0 时使用默认值 7 天。
  int32 max_age = 3;
}

// Trace 链路追踪配置。
message Trace {
  // 是否通过 OTLP 上报链路数据。关闭时仍在本地生成 trace_id/span_id，
  // 日志里的链路 ID 不会为空。
  bool enabled = 1;
  // OTLP/HTTP 上报地址，如 http://127.0.0.1:4318/v1/traces。
  string endpoint = 2;
}

// Auth 接口鉴权配置。调用方通过 HTTP header X-Api-Key 或 gRPC metadata
// x-api-key 传入密钥，与 apiKey 做常量时间比对。
message Auth {
  // 所有接口统一的调用方密钥，为空时一律拒绝访问，避免漏配导致接口裸奔。
  string apiKey = 1;
}

// Sf 顺丰开放平台配置，键名与顺丰开放平台文档保持一致。
message Sf {
  // Sender 默认寄件人信息，下单未传寄件人时作为寄件方联系人。
  message Sender {
    string name = 1; // 寄件人姓名
    string mobile = 2; // 寄件人手机号
    string province = 3; // 寄件人所在省份
    string city = 4; // 寄件人所在城市
    string county = 5; // 寄件人所在区/县
    string address = 6; // 寄件人详细地址
  }
  // 顾客编码，即合作伙伴编码 CustomerCode。
  string partnerID = 1;
  // 校验码，即合作伙伴密钥 checkWord，不下发给调用方。
  string secret = 2;
  // 网关地址，沙箱 https://sfapi-sbox.sf-express.com
  // 正式 https://bspgw.sf-express.com。
  string host = 3;
  // 月结卡号，月结/货到付款下单必填。
  string custID = 4;
  Sender sender = 5;
  // 云打印面单模板编码，如 fm_150_standard_{partnerID}。
  string templateCode = 6;
}
