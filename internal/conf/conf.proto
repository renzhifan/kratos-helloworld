syntax = "proto3";
package kratos.api;

option go_package = "logisticsServer/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logger logger = 3;
  Trace trace = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // 认证密码，为空表示无需认证。
    string password = 5;
    // 逻辑库编号，0 表示默认库。
    int32 db = 6;
    // 建立连接的超时时间。
    google.protobuf.Duration dial_timeout = 7;
  }
  Database database = 1;
  Redis redis = 2;
}

// Logger 日志输出配置。
message Logger {
  // 最低输出级别：info/warn/error。数据表 SQL 日志与请求日志均为 info 级别。
  string level = 1;
  // 日志目录，为空时只输出到标准输出。
  string path = 2;
  // 日志文件保留天数，0 时使用默认值 7 天。
  int32 max_age = 3;
}

// Trace 链路追踪配置。
message Trace {
  // 是否通过 OTLP 上报链路数据。关闭时仍在本地生成 trace_id/span_id，
  // 日志里的链路 ID 不会为空。
  bool enabled = 1;
  // OTLP/HTTP 上报地址，如 http://127.0.0.1:4318/v1/traces。
  string endpoint = 2;
}
