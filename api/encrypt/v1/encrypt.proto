syntax = "proto3";

package api.encrypt.v1;


import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "helloworld/api/encrypt/v1;v1";

service Encrypt {
	rpc CreateEncrypt (CreateEncryptRequest) returns (CreateEncryptReply){
		option (google.api.http) = {
			post: "/v1/encrypt"
			body: "*"
		};
	};
	rpc GetEncrypt (GetEncryptRequest) returns (GetEncryptReply) {
		option (google.api.http) = {
			get: "/v1/encrypt/{encryptId}"
		};
	};
	rpc BatchGetEncrypt (BatchGetEncryptRequest) returns (BatchGetEncryptReply) {
		option (google.api.http) = {
			post: "/v1/encrypt/batch"
			body: "*"
		};
	}
	// Ping 健康检查探活，免鉴权，HTTP 与 gRPC 均可调用
	rpc Ping (PingRequest) returns (PingReply) {
		option (google.api.http) = {
			get: "/v1/ping"
		};
	};
}

message CreateEncryptRequest {
	string originalData = 1 [(validate.rules).string = {min_len: 1}];
}
message CreateEncryptReply {
	uint64 encryptId = 1;
}

message GetEncryptRequest {
	uint64 encryptId = 1 [(validate.rules).uint64 = {gt: 0}];
}
message GetEncryptReply {
	string originalData = 1;
	uint64 encryptId = 2;
}

message BatchGetEncryptRequest {
	repeated uint64 encryptIds = 1;
}
message BatchGetEncryptReply {
	map<uint64, string> data = 1;
}

message PingRequest {
	string message = 1;
}
message PingReply {
	string message = 1;
}